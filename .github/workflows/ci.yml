name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: oxlint
        run: npx oxlint .

      - name: ESLint
        run: npx eslint .

      - name: Prettier
        run: npx prettier --check src/

      - name: Type check
        run: npm run type-check

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build-only
